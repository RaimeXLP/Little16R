name: Build rootful prototype

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: little16r-pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      THEOS_PACKAGE_SCHEME: ""
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure build environment
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(sed -n 's/^Version: //p' control)"
          test -n "$base_version"
          printf 'THEOS=%s/little16r-theos\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'LITTLE16R_PACKAGE_VERSION=%s+build.%s.%s\n' "$base_version" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Install build tools
        run: brew install make ldid xz dpkg

      - name: Fetch pinned Theos
        shell: bash
        run: |
          set -euo pipefail
          git init "$THEOS"
          git -C "$THEOS" remote add origin https://github.com/theos/theos.git
          git -C "$THEOS" fetch --depth=1 origin 304e0799973e8145f32e4ca2de6c747a84b758ce
          git -C "$THEOS" checkout --detach FETCH_HEAD
          git -C "$THEOS" submodule update --init --recursive --depth=1
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Fetch pinned Preferences linker stub
        shell: bash
        run: |
          set -euo pipefail
          frameworks="$RUNNER_TEMP/little16r-private-frameworks"
          mkdir -p "$frameworks/Preferences.framework"
          stub="$frameworks/Preferences.framework/Preferences.tbd"
          curl --fail --location --retry 3 --output "$stub" \
            https://raw.githubusercontent.com/theos/sdks/0222fd5413cf4b9af096f37b4621afa2688572f7/iPhoneOS14.5.sdk/System/Library/PrivateFrameworks/Preferences.framework/Preferences.tbd
          printf '11c41f5b5e5f3e713497fe8b89e1aaa342b27111db6bd61e066758844b9f2d3f  %s\n' "$stub" | shasum -a 256 --check
          printf 'LITTLE16R_PRIVATE_FRAMEWORKS_DIR=%s\n' "$frameworks" >> "$GITHUB_ENV"

      - name: Build rootful package
        run: gmake clean package PACKAGE_VERSION="$LITTLE16R_PACKAGE_VERSION"

      - name: Test Homebar hooks, repository metadata and respring signals
        run: python3 -B -m unittest discover -s tests -v

      - name: Check package architecture and layout
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(packages/*.deb)
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          test "$(dpkg-deb -f "$package" Architecture)" = "iphoneos-arm"
          test "$(dpkg-deb -f "$package" Package)" = "io.github.raimexlp.little16r"
          test "$(dpkg-deb -f "$package" Version)" = "$LITTLE16R_PACKAGE_VERSION"
          package_control="$RUNNER_TEMP/little16r-control-check"
          dpkg-deb -e "$package" "$package_control"
          test -x "$package_control/postinst"
          cmp "$package_control/postinst" layout/DEBIAN/postinst
          extraction="$RUNNER_TEMP/little16r-package-check"
          mkdir -p "$extraction"
          dpkg-deb -x "$package" "$extraction"
          test -f "$extraction/Library/MobileSubstrate/DynamicLibraries/Little16R.dylib"
          test -f "$extraction/Library/MobileSubstrate/DynamicLibraries/Little16R.plist"
          test ! -d "$extraction/var/jb"
          xcrun lipo "$extraction/Library/MobileSubstrate/DynamicLibraries/Little16R.dylib" -verify_arch arm64
          xcrun otool -L "$extraction/Library/MobileSubstrate/DynamicLibraries/Little16R.dylib"
          preferences="$extraction/Library/PreferenceBundles/Little16RPrefs.bundle"
          test -f "$preferences/Little16RPrefs"
          test -f "$preferences/Root.plist"
          test -f "$preferences/Info.plist"
          test -f "$extraction/Library/PreferenceLoader/Preferences/Little16R.plist"
          xcrun lipo "$preferences/Little16RPrefs" -verify_arch arm64
          xcrun otool -L "$preferences/Little16RPrefs"

      - name: Upload package for manual device testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Little16R-rootful-alpha
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Sileo repository
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - name: Check out package archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: published

      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Little16R-rootful-alpha
          path: packages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Generate APT repository
        env:
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 source/scripts/build_repo.py
          --packages packages --output published --template source/repo
          --source-commit "$GITHUB_SHA" --build-url "$BUILD_URL"

      - name: Check Sileo repository and install signals
        run: python3 -B -m unittest discover -s source/tests -v

      - name: Archive published packages under maintainer identity
        shell: bash
        run: |
          set -euo pipefail
          git -C published config user.name 'Leon Prinz'
          git -C published config user.email '41763410+RaimeXLP@users.noreply.github.com'
          git -C published add --all
          if ! git -C published diff --cached --quiet; then
            git -C published commit --author='Leon Prinz <41763410+RaimeXLP@users.noreply.github.com>' -m "Publish Little16R build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            git -C published push origin HEAD:gh-pages
          fi
          mkdir site
          git -C published archive --format=tar HEAD | tar -x -C site

      - name: Upload Sileo repository for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          include-hidden-files: true

      - name: Deploy Sileo repository
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
